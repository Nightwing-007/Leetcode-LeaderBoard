server.port=8080

# Application Name
spring.application.name=sece-leaderboard-backend

# ===================================================================
# Database Configuration (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sece_leaderboard
spring.datasource.username=postgres
spring.datasource.password=Suj@y2011
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Multipart Upload Limits (for large Excel reports)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom Application Settings
app.admin.pin=sece2026
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173
