server.port=${PORT:8080}

# Application Name
spring.application.name=sece-leaderboard-backend

# ===================================================================
# Database Configuration (PostgreSQL with Environment Variable Injection)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sece_leaderboard}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Suj@y2011}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Initialize V2 Normalized Schema and SQL Ranking Views
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# Multipart Upload Limits (for large Excel reports)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom Application Settings
app.admin.pin=${APP_ADMIN_PIN:sece2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:80,http://localhost}

# Admin Authentication & JWT Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:sece2026}
admin.jwt.secret=${JWT_SECRET:SECE_LEADERBOARD_SUPER_SECURE_JWT_SECRET_KEY_2026_COLLEGE_DASHBOARD}
admin.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
